---
- name: Deploy ER-MAP Application Server
  hosts: staging, production
  become: true
  vars_files:
    - vars/default.yaml

  tasks:
    - name: Update apt package cache (Ubuntu/Debian)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install system dependencies
      package:
        name:
          - git
          - docker.io
          - nginx
          - python3-pip
        state: present

    - name: Ensure docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install docker-py python library for Ansible Docker modules
      pip:
        name: docker
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Clone or pull Git repository
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: yes
      become: false

    - name: Write application env file
      copy:
        content: |
          GROQ_API_KEY="{{ groq_api_key }}"
          PORT="{{ app_port }}"
        dest: "{{ app_dir }}/.env"
        mode: '0600'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Build Docker Image
      docker_image:
        build:
          path: "{{ app_dir }}"
        name: "{{ docker_image_name }}"
        tag: "{{ docker_image_tag }}"
        source: build
        force_source: yes

    - name: Run ER-MAP Docker Container
      docker_container:
        name: "{{ docker_container_name }}"
        image: "{{ docker_image_name }}:{{ docker_image_tag }}"
        state: started
        restart_policy: always
        recreate: yes
        ports:
          - "{{ app_port }}:{{ app_port }}"
        env_file: "{{ app_dir }}/.env"

    - name: Configure Nginx reverse proxy site configuration
      copy:
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        dest: /etc/nginx/sites-available/er-map
        mode: '0644'
      notify: Restart Nginx

    - name: Disable Nginx default site (if exists)
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Enable Nginx ER-MAP site config
      file:
        src: /etc/nginx/sites-available/er-map
        dest: /etc/nginx/sites-enabled/er-map
        state: link
      notify: Restart Nginx

    - name: Wait for application to become healthy
      uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
        return_content: yes
      register: health_check
      until: "health_check.status == 200 and 'ok' in health_check.content"
      retries: 6
      delay: 5

    - name: Output deployment health status
      debug:
        msg: "Application is healthy! Response content: {{ health_check.content }}"

  handlers:
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

